<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>WaveCue · Email confirmed</title>
  <style>
    /* WaveCue's welcome-screen look: black night sky, glowing blue title */
    :root {
      --bg: #000;
      --text: #eaf6ff;
      --muted: #9fb3c8;
      --brand: #4db8ff;
      --button: #5ec2ff;
      --button-text: #0b1d3a;
      --error: #ff8a8a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
    }
    /* a few static stars, drawn with layered gradients so the page needs no images */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 28% 72%, #cfd8ff 60%, transparent 61%),
        radial-gradient(1.5px 1.5px at 44% 12%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 61% 38%, #fff 60%, transparent 61%),
        radial-gradient(2px 2px at 78% 22%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 88% 64%, #cfd8ff 60%, transparent 61%),
        radial-gradient(1.5px 1.5px at 8% 86%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 52% 90%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 70% 80%, #fff 60%, transparent 61%),
        radial-gradient(1.5px 1.5px at 94% 8%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 20% 45%, #fff 60%, transparent 61%),
        radial-gradient(1px 1px at 36% 30%, #cfd8ff 60%, transparent 61%);
      opacity: 0.8;
    }
    main {
      position: relative;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--brand);
      text-shadow: 0 0 18px rgba(77, 184, 255, 0.85);
    }
    .badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--button);
      color: var(--button-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge svg { width: 32px; height: 32px; }
    .error .badge { background: var(--error); }
    h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
    }
    p {
      margin: 0 auto;
      max-width: 340px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>WaveCue</h1>

    <!-- shown after a successful confirmation (the normal case) -->
    <section id="ok">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2>Your email is confirmed</h2>
      <p>You're all set. Go back to the WaveCue app and log in with your email and password.</p>
    </section>

    <!-- shown when Supabase sends people here with an error, e.g. an expired or already-used link -->
    <section id="failed" class="error" hidden>
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>
      </div>
      <h2>This link didn't work</h2>
      <p id="failed-text">It may have expired or already been used. Try logging in to WaveCue. If that doesn't work, sign up again to get a new confirmation email.</p>
    </section>
  </main>

  <script>
    // Supabase redirects here after checking the confirmation link. On success the address
    // carries sign-in tokens after the "#"; on failure it carries "error=...". This page never
    // uses or sends the tokens. It only picks which message to show, then wipes them from the
    // address bar so they aren't left in history or shared by accident.
    (function () {
      var raw = (window.location.hash || '').replace(/^#/, '') || (window.location.search || '').replace(/^\?/, '');
      var params = new URLSearchParams(raw);
      if (params.get('error') || params.get('error_code')) {
        document.getElementById('ok').hidden = true;
        document.getElementById('failed').hidden = false;
        if (params.get('error_code') === 'otp_expired') {
          document.getElementById('failed-text').textContent =
            'This confirmation link has expired or was already used. Try logging in to WaveCue. If that doesn’t work, sign up again to get a new link.';
        }
      }
      if (raw && window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
